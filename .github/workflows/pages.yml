name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: new/package-lock.json
      - name: Build site
        env:
          # 공개용(publishable) 키 – 브라우저에 그대로 노출되는 값
          VITE_SUPABASE_URL: https://fkwqaedrqtaohreiweco.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_WIxY8SLv88QZ-jAN8eFHqQ_Un_dv77o
        run: ./scripts/build-site.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
